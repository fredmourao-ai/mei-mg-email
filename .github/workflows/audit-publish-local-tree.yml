name: Publish validated audit tree

on:
  push:
    branches:
      - audit/fullstack-security-20260908

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/fullstack-security-20260908

      - name: Verify and apply exact validated audit patch
        shell: bash
        env:
          PATCH: /home/ubuntu/mei-audit-publish-dbef857.patch
          EXPECTED_PATCH_SHA: 2095681d160e75d59eb8a91c9900188dddec16ca7bed29f14bfeaed0c4c7353b
        run: |
          set -Eeuo pipefail
          test -s "$PATCH"
          echo "$EXPECTED_PATCH_SHA  $PATCH" | sha256sum -c -
          if git apply --check "$PATCH"; then
            git apply --index "$PATCH"
            git diff --cached --check
            git config user.name github-actions
            git config user.email github-actions@github.com
            git commit -m "fix: harden Brevo runtime and canonical email flow"
            git push origin HEAD:audit/fullstack-security-20260908
          elif git apply --reverse --check "$PATCH"; then
            echo "Validated audit patch is already applied."
          else
            echo "Patch neither applies nor is already applied." >&2
            exit 21
          fi
