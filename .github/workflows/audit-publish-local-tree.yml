name: Publish validated audit tree

on:
  push:
    branches:
      - audit/fullstack-security-20260908

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/fullstack-security-20260908

      - name: Apply exact validated local diff and remove transport workflow
        shell: bash
        env:
          SOURCE: /home/ubuntu/mei-mg-email/.worktrees/fullstack-security-20260908
          EXPECTED_HEAD: efab65f25467511d029675851944a6c139e4fe43
          BASE: e2b751fde06bd09d37123818a33d6b7c2c876c79
        run: |
          set -Eeuo pipefail
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$SOURCE" merge-base HEAD "$BASE")" = "$BASE"
          test -z "$(git -C "$SOURCE" status --porcelain)"
          git -C "$SOURCE" diff --binary "$BASE..$EXPECTED_HEAD" > /tmp/mei-audit-validated.patch
          test -s /tmp/mei-audit-validated.patch
          git apply --check /tmp/mei-audit-validated.patch
          git apply --index /tmp/mei-audit-validated.patch
          git rm .github/workflows/audit-publish-local-tree.yml
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "fix: harden Brevo runtime and canonical email flow"
          git push origin HEAD:audit/fullstack-security-20260908
