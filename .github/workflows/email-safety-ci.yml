name: Email Safety CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "scripts/**"
      - "deploy/systemd/**"
      - "templates/**"
      - "db/migrations/**"
      - "ops/**"
      - "tests/**"
      - "requirements*.txt"
      - "docker-compose.yml"
      - ".github/workflows/email-safety-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "scripts/**"
      - "deploy/systemd/**"
      - "templates/**"
      - "db/migrations/**"
      - "ops/**"
      - "tests/**"
      - "requirements*.txt"
      - "docker-compose.yml"
      - ".github/workflows/email-safety-ci.yml"

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMAIL_PROVIDER: dryrun
      BASE_URL_DESCADASTRO: https://dev.shopvivaliz.com.br/descadastro
      MAX_ENVIOS_POR_DIA: "10000"
      META_ENVIOS_POR_DIA: "9950"
      RATE_LIMIT_ENVIOS_POR_MINUTO: "30"
      DELIVERABILITY_MAX_ENVIOS_POR_MINUTO: "10"
      QUEUE_MIN_PENDING: "1000"
      QUEUE_TARGET_PENDING: "5000"
      MONITOR_INTERVAL_SECONDS: "60"
      MONITOR_SEND_STALL_MINUTES: "10"
      MONITOR_BASE_MAX_AGE_HOURS: "26"
      POSTGRES_PASSWORD: ci_postgres_password_not_for_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject committed credentials
        run: python scripts/auditar_segredos_repo.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax error in $($_.FullName): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile application and operational scripts
        run: python -m compileall -q app worker scripts

      - name: Validate all Flyway migrations on clean PostgreSQL
        run: |
          docker compose up -d db
          docker compose run --rm flyway migrate
          docker compose run --rm flyway info

      - name: Run email safety unit tests
        run: pytest -q tests/test_worker_safety.py tests/test_queue_replenisher.py tests/test_monitor_operacao.py tests/test_sender_blocked_circuit.py tests/test_ndr_guard.py tests/test_import_policy.py
