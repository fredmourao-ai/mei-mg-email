name: Email Safety CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 15
    env:
      EMAIL_PROVIDER: dryrun
      BASE_URL_DESCADASTRO: https://dev.shopvivaliz.com.br/descadastro
      MAX_ENVIOS_POR_DIA: "300"
      META_ENVIOS_POR_DIA: "300"
      RATE_LIMIT_ENVIOS_POR_MINUTO: "30"
      DELIVERABILITY_MAX_ENVIOS_POR_MINUTO: "10"
      QUEUE_MIN_PENDING: "14800"
      QUEUE_TARGET_PENDING: "15000"
      MONITOR_INTERVAL_SECONDS: "60"
      MONITOR_SEND_STALL_MINUTES: "10"
      MONITOR_BASE_MAX_AGE_HOURS: "26"
      POSTGRES_PASSWORD: ci_postgres_password_not_for_production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject committed credentials
        run: python scripts/auditar_segredos_repo.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax error in $($_.FullName): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Reject high-severity Python SAST findings
        run: bandit -q -lll -r app worker scripts -x tests

      - name: Compile application and operational scripts
        run: python -m compileall -q app worker scripts

      - name: Validate all Flyway migrations on clean PostgreSQL
        run: |
          docker compose up -d db
          docker compose run --rm flyway migrate
          docker compose run --rm flyway info

      - name: Enforce canonical repository policy
        run: python scripts/repo_policy_guard.py

      - name: Self-test extreme-audit governance
        run: python scripts/validate-audit-governance.py --output-dir runtime/audit-governance-self-test

      - name: Run email safety unit tests
        run: pytest -q
