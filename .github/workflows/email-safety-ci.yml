name: Email Safety CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "worker/**"
      - "scripts/**"
      - "deploy/systemd/**"
      - "templates/**"
      - "db/migrations/**"
      - "runtime/sender_blocked.pause"
      - "tests/test_worker_safety.py"
      - "tests/test_queue_replenisher.py"
      - "tests/test_monitor_operacao.py"
      - "tests/test_sender_blocked_circuit.py"
      - "requirements*.txt"
      - ".github/workflows/email-safety-ci.yml"

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMAIL_PROVIDER: dryrun
      BASE_URL_DESCADASTRO: https://dev.shopvivaliz.com.br/descadastro
      MAX_ENVIOS_POR_DIA: "10000"
      META_ENVIOS_POR_DIA: "9950"
      RATE_LIMIT_ENVIOS_POR_MINUTO: "30"
      QUEUE_MIN_PENDING: "1000"
      QUEUE_TARGET_PENDING: "5000"
      MONITOR_INTERVAL_SECONDS: "60"
      MONITOR_SEND_STALL_MINUTES: "10"
      MONITOR_BASE_MAX_AGE_HOURS: "26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile application and operational scripts
        run: python -m compileall -q app worker scripts

      - name: Run email safety unit tests
        run: pytest -q tests/test_worker_safety.py tests/test_queue_replenisher.py tests/test_monitor_operacao.py tests/test_sender_blocked_circuit.py
