name: Exchange Sender Unblock

on:
  push:
    branches: [main]
    paths:
      - "ops/exchange-unblock-request.json"

permissions:
  contents: read

concurrency:
  group: exchange-sender-unblock
  cancel-in-progress: false

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXCHANGE_ADMIN_ACCESS_TOKEN: ${{ secrets.EXCHANGE_ADMIN_ACCESS_TOKEN }}
      MICROSOFT_EXCHANGE_ADMIN_TOKEN: ${{ secrets.MICROSOFT_EXCHANGE_ADMIN_TOKEN }}
      MICROSOFT_GRAPH_ADMIN_TOKEN: ${{ secrets.MICROSOFT_GRAPH_ADMIN_TOKEN }}
      MICROSOFT_GRAPH_ACCESS_TOKEN: ${{ secrets.MICROSOFT_GRAPH_ACCESS_TOKEN }}
      EXCHANGE_ADMIN_UPN: ${{ secrets.EXCHANGE_ADMIN_UPN }}
      EXCHANGE_ORGANIZATION: ${{ vars.EXCHANGE_ORGANIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate incident request
        shell: pwsh
        run: |
          $request = Get-Content ops/exchange-unblock-request.json -Raw | ConvertFrom-Json
          if ($request.sender -ne 'naoresponda@dev.shopvivaliz.com.br') { throw 'Unexpected sender in unblock request.' }
          if ($request.error_code -ne 'AS(42004)') { throw 'Unexpected incident code in unblock request.' }
          if (-not $request.worker_must_remain_paused) { throw 'Unblock request must keep production worker paused.' }
          Write-Host "INCIDENT_REQUEST_VALID sender=$($request.sender) code=$($request.error_code)"

      - name: Validate Exchange admin secret
        shell: pwsh
        run: |
          $tokens = @(
            $env:EXCHANGE_ADMIN_ACCESS_TOKEN,
            $env:MICROSOFT_EXCHANGE_ADMIN_TOKEN,
            $env:MICROSOFT_GRAPH_ADMIN_TOKEN,
            $env:MICROSOFT_GRAPH_ACCESS_TOKEN
          )
          $available = @($tokens | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($available.Count -eq 0) {
            throw 'EXCHANGE_ADMIN_TOKEN_MISSING: no recognized GitHub Actions secret is configured. Do not paste tokens into workflow files or logs.'
          }
          Write-Host 'EXCHANGE_ADMIN_SECRET_PRESENT=true'

      - name: Install Exchange Online module
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force -AllowClobber
          Import-Module ExchangeOnlineManagement
          Write-Host "EXO_MODULE_READY version=$((Get-Module ExchangeOnlineManagement).Version)"

      - name: Unblock restricted sender
        shell: pwsh
        run: |
          $tokens = @(
            $env:EXCHANGE_ADMIN_ACCESS_TOKEN,
            $env:MICROSOFT_EXCHANGE_ADMIN_TOKEN,
            $env:MICROSOFT_GRAPH_ADMIN_TOKEN,
            $env:MICROSOFT_GRAPH_ACCESS_TOKEN
          )
          $available = @($tokens | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $token = [string]$available[0]
          Write-Output "::add-mask::$token"
          $org = if ([string]::IsNullOrWhiteSpace($env:EXCHANGE_ORGANIZATION)) { 'contabilidademelo.onmicrosoft.com' } else { $env:EXCHANGE_ORGANIZATION }
          ./scripts/desbloquear_exchange_sender_v2.ps1 `
            -AccessToken $token `
            -SenderAddress 'naoresponda@dev.shopvivaliz.com.br' `
            -Organization $org `
            -AdminUpn $env:EXCHANGE_ADMIN_UPN

      - name: Verify production worker remains paused
        if: always()
        shell: bash
        run: |
          test -f runtime/sender_blocked.pause
          echo "WORKER_PAUSE_MARKER_REMAINS=true"
          echo "Resume only after Exchange unblock confirmation and propagation verification."
