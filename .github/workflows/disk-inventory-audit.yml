name: Disk Inventory Audit 2026-09-19

on:
  push:
    branches:
      - audit/disk-inventory-20260919

permissions:
  contents: read

concurrency:
  group: disk-inventory-audit-20260919
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: [self-hosted, Linux, ARM64, mei-backend]
    timeout-minutes: 20
    steps:
      - name: Inventory disk consumers without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DF_BEGIN"
          df -h /
          df -i /
          echo "DF_END"
          echo "ROOT_DU_BEGIN"
          if sudo -n true 2>/dev/null; then
            sudo -n du -xhd1 / 2>/dev/null | sort -h
          else
            du -xhd1 /home/ubuntu 2>/dev/null | sort -h
          fi
          echo "ROOT_DU_END"
          echo "HOME_TOP_BEGIN"
          du -xhd1 /home/ubuntu 2>/dev/null | sort -h | tail -40
          echo "HOME_TOP_END"
          echo "WORKSPACES_BEGIN"
          shopt -s nullglob
          for d in /home/ubuntu/chat-workspaces/*; do
            [ -d "$d" ] || continue
            bytes="$(du -sb "$d" 2>/dev/null | awk '{print $1}')"
            mt="$(date -u -r "$d" +%FT%TZ 2>/dev/null || echo unknown)"
            kind=not_git
            dirty=na
            active=no
            remote_head=na
            head=na
            if git -C "$d" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              kind=git
              head="$(git -C "$d" rev-parse HEAD 2>/dev/null || echo na)"
              if [ -n "$(git -C "$d" status --porcelain=v1 2>/dev/null)" ]; then dirty=yes; else dirty=no; fi
              for p in /proc/[0-9]*/cwd; do
                target="$(readlink "$p" 2>/dev/null || true)"
                case "$target" in "$d"|"$d"/*) active=yes; break;; esac
              done
              if git -C "$d" branch -r --contains "$head" 2>/dev/null | grep -q .; then remote_head=yes; else remote_head=no; fi
            fi
            printf 'WORKSPACE bytes=%s modified=%s kind=%s dirty=%s active=%s remote_head=%s head=%s path=%s\n' "$bytes" "$mt" "$kind" "$dirty" "$active" "$remote_head" "$head" "$d"
          done
          echo "WORKSPACES_END"
          echo "DOCKER_DF_BEGIN"
          docker system df -v || true
          echo "DOCKER_DF_END"
          echo "DOCKER_LOGS_BEGIN"
          if sudo -n true 2>/dev/null; then
            sudo -n find /var/lib/docker/containers -type f -name '*-json.log' -printf '%s %p\n' 2>/dev/null | sort -nr | head -30
          fi
          echo "DOCKER_LOGS_END"
          echo "CACHE_BEGIN"
          du -sh /home/ubuntu/.npm /home/ubuntu/.cache /home/ubuntu/.local /home/ubuntu/.venvs /home/ubuntu/.codex 2>/dev/null || true
          du -sh /home/ubuntu/.npm/* /home/ubuntu/.cache/* 2>/dev/null | sort -h | tail -40 || true
          echo "CACHE_END"
          echo "LOGS_BEGIN"
          du -xhd1 /var/log 2>/dev/null | sort -h | tail -30 || true
          journalctl --disk-usage 2>/dev/null || true
          echo "LOGS_END"
          echo "DELETED_OPEN_BEGIN"
          if command -v lsof >/dev/null 2>&1; then
            sudo -n lsof +L1 2>/dev/null | awk 'NR==1 || $7 ~ /^[0-9]+$/ {print}' | sort -k7,7nr | head -40 || true
          fi
          echo "DELETED_OPEN_END"
