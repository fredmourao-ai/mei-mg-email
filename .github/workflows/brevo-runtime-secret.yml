name: Brevo Runtime Secret

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite MATERIALIZE_BREVO_RUNTIME para confirmar'
        required: true
        type: string
      mode:
        description: 'secret_only grava apenas a chave; cutover aplica provider e limites Brevo'
        required: true
        type: choice
        default: secret_only
        options:
          - secret_only
          - cutover

permissions:
  contents: read

concurrency:
  group: brevo-runtime-secret
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 5
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate manual authorization and key presence
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ inputs.confirmation }}' = MATERIALIZE_BREVO_RUNTIME
          test -n "$BREVO_API_KEY"
          echo "::add-mask::$BREVO_API_KEY"
          echo "authorization_valid=true"

      - name: Materialize protected runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/materialize_brevo_runtime_secret.py --mode '${{ inputs.mode }}'

      - name: Verify without exposing credential value
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/home/ubuntu/mei-mg-email/.env')
          values = {}
          for line in path.read_text(encoding='utf-8').splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip()
          key = values.get('BREVO_API_KEY', '')
          if len(key) < 20:
              raise SystemExit('BREVO runtime key verification failed')
          print(f"backend_brevo_key_present=true length={len(key)}")
          mode = '${{ inputs.mode }}'
          if mode == 'cutover':
              expected = {
                  'EMAIL_PROVIDER': 'brevo',
                  'MAX_ENVIOS_POR_DIA': '300',
                  'META_ENVIOS_POR_DIA': '295',
              }
              bad = [name for name, expected_value in expected.items() if values.get(name) != expected_value]
              if bad:
                  raise SystemExit('cutover verification failed: ' + ','.join(bad))
              print('brevo_cutover_env_verified=true')
          PY
