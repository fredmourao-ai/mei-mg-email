name: PR Auto Merge

on:
  workflow_run:
    workflows:
      - Email Safety CI
      - Repository Policy Guard
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: pr-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-if-green:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 10
    steps:
      - name: Resolve same-repository PR and require all applicable checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_json="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open") | select(.head.repo.full_name == .base.repo.full_name)][0]')"
          test "$pr_json" != "null" || { echo 'No eligible open same-repository PR'; exit 0; }
          pr_number="$(jq -r '.number' <<<"$pr_json")"
          checks="$(gh pr checks "$pr_number" --repo "$REPO" --json name,bucket)"
          jq -e 'length > 0 and all(.bucket == "pass" or .bucket == "skipping")' <<<"$checks" >/dev/null
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge validated PR
        if: steps.gate.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
