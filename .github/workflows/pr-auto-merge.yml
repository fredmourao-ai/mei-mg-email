name: PR Auto Merge

on:
  workflow_run:
    workflows:
      - Email Safety CI
      - Repository Policy Guard
      - Repository Governance Gate
      - AI Conflict Resolver
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  statuses: read

concurrency:
  group: pr-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-if-green:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 10
    steps:
      - name: Resolve same-repository PR and require all applicable checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          pulls="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls")"
          pr_json="$(jq --arg sha "$HEAD_SHA" '[.[] | select(.state == "open") | select(.head.repo.full_name == .base.repo.full_name) | select(.base.ref == "main") | select(.head.sha == $sha)][0]' <<<"$pulls")"
          if [ "$pr_json" = "null" ]; then
            echo 'No eligible open same-repository PR for this exact head SHA.'
            exit 0
          fi
          pr_number="$(jq -r '.number' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"

          required=('Repository Policy Guard' 'Repository Governance Gate' 'AI Conflict Resolver')
          required_json="$(printf '%s\n' "${required[@]}" | jq -R . | jq -s .)"
          workflow_runs="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"
          if ! jq -e --argjson required "$required_json" '
            . as $root |
            (all($required[];
              . as $name |
              ($root.workflow_runs | map(select(.name == $name)) | sort_by(.created_at) | last) as $run |
              ($run != null) and
              ($run.status == "completed") and
              ($run.conclusion == "success")
            )) and
            (
              ($root.workflow_runs | map(select(.name == "Email Safety CI"))) as $safety |
              (($safety | length) == 0) or
              (($safety | sort_by(.created_at) | last) as $run |
                ($run.status == "completed") and ($run.conclusion == "success"))
            )
          ' <<<"$workflow_runs" >/dev/null; then
            echo 'Canonical pull-request workflows are not all complete and green yet.'
            exit 0
          fi

          checks="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"
          if ! jq -e '
            (.total_count > 0) and
            all(.check_runs[];
              .status == "completed" and
              (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral")
            )
          ' <<<"$checks" >/dev/null; then
            echo 'Check runs are not all complete and green yet.'
            exit 0
          fi

          statuses="$(gh api "repos/$REPO/commits/$HEAD_SHA/status")"
          if ! jq -e '(.statuses | length == 0) or .state == "success"' <<<"$statuses" >/dev/null; then
            echo 'Legacy commit statuses are not green.'
            exit 0
          fi

          current_pr="$(gh api "repos/$REPO/pulls/$pr_number")"
          jq -e --arg sha "$HEAD_SHA" '
            .state == "open" and
            .base.ref == "main" and
            .head.sha == $sha and
            .head.repo.full_name == .base.repo.full_name
          ' <<<"$current_pr" >/dev/null

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Merge validated PR
        if: steps.gate.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$HEAD_SHA")"
          jq -e '.merged == true' <<<"$result" >/dev/null
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" >/dev/null 2>&1 || true
