name: Repository Governance Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  governance-gate:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate governance contract
        run: bash scripts/repository-governance-validate.sh ci
