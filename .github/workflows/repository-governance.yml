name: Repository Governance Gate
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  governance-gate:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate governance contract
        run: bash scripts/repository-governance-validate.sh ci
