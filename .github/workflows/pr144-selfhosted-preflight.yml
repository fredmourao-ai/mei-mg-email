name: PR144 Selfhosted Preflight 2026-09-19
on:
  push:
    branches: [audit/pr144-preflight-20260919]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, Linux, ARM64, mei-backend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/final-audit-filter-clarification-20260919
          fetch-depth: 0
      - name: Run focused audit gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-audit-governance.py --output-dir runtime/audit-governance-self-test
          python3 scripts/repo_policy_guard.py
          bash -n scripts/instalar_monitoramento_vm.sh
          bash -n scripts/instalar_autorepair_vm.sh
          .venv/bin/python -m pytest -q tests/test_service_continuity_guards.py tests/test_brevo_runtime_contract.py tests/test_runtime_policy_contract_guard.py tests/test_sender_blocked_circuit.py
