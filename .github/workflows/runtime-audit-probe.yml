name: Runtime Audit Probe 2026-09-19

on:
  push:
    branches:
      - audit/runtime-probe-20260919

permissions:
  contents: read

concurrency:
  group: runtime-audit-probe-20260919
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, mei-backend]
    timeout-minutes: 15
    steps:
      - name: Align production checkout to audited main
        shell: bash
        run: |
          set -Eeuo pipefail
          prod=/home/ubuntu/mei-mg-email
          test -d "$prod/.git"
          test -z "$(git -C "$prod" status --porcelain=v1)"
          before="$(git -C "$prod" rev-parse HEAD)"
          git -C "$prod" fetch origin main --prune
          target="$(git -C "$prod" rev-parse origin/main)"
          git -C "$prod" merge-base --is-ancestor "$before" "$target"
          git -C "$prod" merge --ff-only "$target"
          after="$(git -C "$prod" rev-parse HEAD)"
          test "$after" = "$target"
          echo "PROD_BEFORE=$before"
          echo "PROD_AFTER=$after"

      - name: Capture runtime and database evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          prod=/home/ubuntu/mei-mg-email
          cd "$prod"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "DIRTY=$(git status --porcelain=v1 | wc -l)"
          echo "SENTINEL=$(test -f /var/lib/mei-mg-email/sender_blocked.pause && echo present || echo absent)"
          echo "SENTINEL_DETAIL_BEGIN"
          sed -n '1,6p' /var/lib/mei-mg-email/sender_blocked.pause 2>/dev/null || true
          echo "SENTINEL_DETAIL_END"
          for u in mei-mg-email-api.service mei-mg-email-site-tunnel.service mei-mg-email-brevo-reconciler.service mei-mg-email-monitor.service mei-mg-email-queue-replenisher.service mei-mg-email-worker.service mei-mg-email-ndr-guard.service; do
            printf 'SERVICE %s=' "$u"
            systemctl is-active "$u" || true
          done
          echo "DISK=$(df -P / | awk 'NR==2{print $5}')"
          .venv/bin/python scripts/runtime_policy_guard.py
          .venv/bin/python scripts/runtime_sender_preflight.py
          .venv/bin/python - <<'PY'
          import os, json, psycopg
          from dotenv import load_dotenv
          load_dotenv(".env")
          out={}
          with psycopg.connect(os.environ["DATABASE_URL"],connect_timeout=5) as c:
              with c.cursor() as cur:
                  cur.execute("set statement_timeout='20s'")
                  cur.execute("""
                      select
                        count(*) filter(where status::text='bounce_permanent') as hb,
                        count(*) as total,
                        count(*) filter(where status::text='submitted') as still_submitted,
                        count(*) filter(where status::text='submitted' and last_error ilike 'BREVO transient %') as transient_diag
                      from mei_email.envios
                      where provider_message_id like 'brevo:%'
                        and submitted_at >= now()-interval '24 hours'
                  """)
                  hb,total,still_submitted,transient_diag=cur.fetchone()
                  out["hard_bounces_24h"]=int(hb)
                  out["submitted_cohort_24h"]=int(total)
                  out["hard_bounce_rate_pct"]=round((hb*100.0/total) if total else 0.0,2)
                  out["still_submitted_24h"]=int(still_submitted)
                  out["submitted_with_transient_diagnostic"]=int(transient_diag)
                  cur.execute("""
                      select count(*)
                      from mei_email.envios
                      where status::text='bounce_permanent'
                        and provider_message_id like 'brevo:%'
                        and submitted_at >= now()-interval '24 hours'
                        and not mei_email.is_email_suppressed(email)
                  """)
                  out["hard_bounce_without_suppression"]=int(cur.fetchone()[0])
                  cur.execute("""
                      select count(*)
                      from mei_email.envios
                      where submitted_at > timestamptz '2026-09-19T12:35:01Z'
                  """)
                  out["submitted_after_breaker_open"]=int(cur.fetchone()[0])
                  cur.execute("""
                      select count(*)
                      from mei_email.envios v
                      join mei_email.empresas e on e.cnpj=v.cnpj
                      where v.status::text in ('pendente','enviando','pending','processing')
                        and (
                          coalesce(e.opt_out,false)
                          or e.situacao_cadastral<>'ATIVA'
                          or e.email is null or btrim(e.email::text)=''
                          or v.email is null or btrim(v.email::text)=''
                          or lower(btrim(e.email::text))<>lower(btrim(v.email::text))
                          or not mei_email.is_valid_email_address(e.email)
                          or position('contabil' in lower(btrim(e.email::text)))>0
                          or mei_email.is_email_suppressed(e.email)
                          or mei_email.is_cnpj_suppressed(v.cnpj::text)
                        )
                  """)
                  out["basic_open_policy_violations"]=int(cur.fetchone()[0])
          print("DB_EVIDENCE="+json.dumps(out,sort_keys=True))
          PY
          echo "MONITOR_BEGIN"
          set +e
          .venv/bin/python scripts/monitor_operacao.py --once
          monitor_rc=$?
          set -e
          echo "MONITOR_RC=$monitor_rc"
          test "$monitor_rc" -eq 2
          echo "MONITOR_END"

      - name: Assert stop-the-line remains fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          ! systemctl is-active --quiet mei-mg-email-worker.service
          systemctl is-active --quiet mei-mg-email-brevo-reconciler.service
          systemctl is-active --quiet mei-mg-email-monitor.service
          echo "STOP_THE_LINE_ASSERTION=ok"

      - name: Inspect and apply canonical disk guard
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DISK_BEFORE=$(df -P / | awk 'NR==2{print $5}')"
          du -sh /home/ubuntu/.npm /home/ubuntu/.cache /home/ubuntu/chat-workspaces /home/ubuntu/actions-runner-mei-backend/_work 2>/dev/null || true
          if sudo -n true 2>/dev/null; then
            sudo -n systemctl start shopvivaliz-disk-guard.service
            sudo -n cat /var/lib/shopvivaliz-ops/disk-status.env || true
          else
            echo "DISK_GUARD_SUDO_UNAVAILABLE=true"
          fi
          echo "DISK_AFTER=$(df -P / | awk 'NR==2{print $5}')"


  cleanup-capacity:
    runs-on: [self-hosted, Linux, ARM64, mei-backend]
    needs: probe
    timeout-minutes: 20
    steps:
      - name: Remove only old recoverable inactive chat workspaces
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/home/ubuntu/chat-workspaces
          cutoff="$(date -u -d '2026-09-19 12:00:00 UTC' +%s)"
          removed=0
          preserved=0
          freed=0
          shopt -s nullglob
          for d in "$root"/*; do
            [ -d "$d" ] || continue
            mt="$(stat -c %Y "$d" 2>/dev/null || echo 0)"
            [ "$mt" -lt "$cutoff" ] || { preserved=$((preserved+1)); continue; }
            if ! git -C "$d" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "PRESERVE not_git $d"
              preserved=$((preserved+1))
              continue
            fi
            if [ -n "$(git -C "$d" status --porcelain=v1 2>/dev/null)" ]; then
              echo "PRESERVE dirty $d"
              preserved=$((preserved+1))
              continue
            fi
            active=0
            for p in /proc/[0-9]*/cwd; do
              target="$(readlink "$p" 2>/dev/null || true)"
              case "$target" in "$d"|"$d"/*) active=1; break;; esac
            done
            if [ "$active" -eq 1 ]; then
              echo "PRESERVE active $d"
              preserved=$((preserved+1))
              continue
            fi
            head="$(git -C "$d" rev-parse HEAD)"
            git -C "$d" fetch --all --prune --quiet 2>/dev/null || true
            if ! git -C "$d" branch -r --contains "$head" 2>/dev/null | grep -q .; then
              echo "PRESERVE unpushed_head $d $head"
              preserved=$((preserved+1))
              continue
            fi
            bytes="$(du -sb "$d" 2>/dev/null | awk '{print $1}')"
            if [ -f "$d/.git" ]; then
              common="$(git -C "$d" rev-parse --path-format=absolute --git-common-dir)"
              if git --git-dir="$common" worktree remove "$d" --force; then
                echo "REMOVE worktree bytes=$bytes $d"
              else
                echo "PRESERVE worktree_remove_failed $d"
                preserved=$((preserved+1))
                continue
              fi
            else
              rm -rf -- "$d"
              echo "REMOVE clone bytes=$bytes $d"
            fi
            freed=$((freed+bytes))
            removed=$((removed+1))
          done
          echo "CLEANUP_SUMMARY removed=$removed preserved=$preserved freed_bytes=$freed"
          echo "DISK_POST_WORKSPACE_CLEANUP=$(df -P / | awk 'NR==2{print $5}')"
          if sudo -n true 2>/dev/null; then
            sudo -n systemctl start shopvivaliz-disk-guard.service
            sudo -n cat /var/lib/shopvivaliz-ops/disk-status.env || true
          fi
          echo "DISK_FINAL=$(df -P / | awk 'NR==2{print $5}')"

  restore-proof:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 90
    steps:
      - name: Restore latest MEI backup into isolated PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=/home/ubuntu/.venvs/oci-cli/bin/oci
          NS=gruilpqsbqqb
          BUCKET=shopvivaliz-free-archive
          OBJ=db-backups/main/mei-email-latest.dump
          WORK=/home/ubuntu/.audit-runtime/mei-restore-proof-20260919
          CONTAINER=mei-restore-proof-20260919
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            rm -rf "$WORK"
          }
          trap cleanup EXIT
          "$OCI" os object get --auth instance_principal --namespace-name "$NS" --bucket-name "$BUCKET" --name "$OBJ" --file "$WORK/mei-email-latest.dump" >/dev/null
          "$OCI" os object get --auth instance_principal --namespace-name "$NS" --bucket-name "$BUCKET" --name "$OBJ.sha256" --file "$WORK/mei-email-latest.dump.sha256" >/dev/null
          cd "$WORK"
          sha256sum -c mei-email-latest.dump.sha256
          entries="$(pg_restore -l mei-email-latest.dump | awk 'BEGIN{n=0} /^[^;]/ && NF {n++} END{print n}')"
          echo "RESTORE_ENTRIES=$entries"
          docker run -d --name "$CONTAINER" --cpus 2 --memory 3g -e POSTGRES_HOST_AUTH_METHOD=trust -v "$WORK:/restore:ro" postgres:16-alpine >/dev/null
          ready=0
          for i in $(seq 1 90); do
            if docker exec "$CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec "$CONTAINER" createdb -U postgres restoredb
          echo "RESTORE_STARTED_AT=$(date -u +%FT%TZ)"
          docker exec "$CONTAINER" pg_restore -j 2 -U postgres -d restoredb --no-owner --no-privileges --exit-on-error /restore/mei-email-latest.dump
          echo "RESTORE_FINISHED_AT=$(date -u +%FT%TZ)"
          docker exec "$CONTAINER" psql -U postgres -d restoredb -Atc "select 'RESTORE_TABLES='||count(*) from information_schema.tables where table_schema='mei_email';"
          docker exec "$CONTAINER" psql -U postgres -d restoredb -Atc "select 'RESTORE_EMPRESAS='||count(*) from mei_email.empresas;"
          docker exec "$CONTAINER" psql -U postgres -d restoredb -Atc "select 'RESTORE_ENVIOS='||count(*) from mei_email.envios;"
          docker exec "$CONTAINER" psql -U postgres -d restoredb -Atc "select 'RESTORE_OPEN_QUEUE='||count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing');"
          docker exec "$CONTAINER" psql -U postgres -d restoredb -Atc "select 'RESTORE_FLYWAY_SUCCESS='||count(*) from mei_email.flyway_schema_history where success=true;"
          docker exec "$CONTAINER" psql -U postgres -d restoredb -Atc "select 'RESTORE_DB_SIZE='||pg_size_pretty(pg_database_size('restoredb'));"
          echo "RESTORE_AUDIT_OK"
          cleanup
          trap - EXIT
          echo "RESTORE_CLEANUP_OK"
