name: Absolute Audit Main Guard

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: absolute-audit-main-guard-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-guard:
    runs-on: [self-hosted, Linux, ARM64, mei-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Absolute Audit V5 on published main
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          bash scripts/absolute-audit-governance-validate.sh ci

      - name: Verify merged-PR provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-main-merge-provenance.py --output-dir artifacts/main-merge-provenance

      - name: Verify evidence
        if: always()
        run: |
          set -Eeuo pipefail
          test -s artifacts/audit-governance-self-test/report.json
          test -s artifacts/audit-governance-self-test/report.md
          test -s artifacts/global-audit-policy/report.json
          test -s artifacts/global-audit-policy/report.md
          test -s artifacts/main-merge-provenance/report.json
          test -s artifacts/main-merge-provenance/report.md

      - name: Upload main-guard evidence
        id: github_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: absolute-audit-main-guard-${{ github.run_id }}
          path: |
            artifacts/audit-governance-self-test/
            artifacts/global-audit-policy/
            artifacts/main-merge-provenance/
          if-no-files-found: error
          retention-days: 90

      - name: Publish main-guard evidence fallback
        if: always() && steps.github_artifact.outcome == 'failure'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          bash scripts/publish-main-guard-evidence-oci.sh

      - name: Require published main-guard evidence
        if: always()
        env:
          GITHUB_ARTIFACT_OUTCOME: ${{ steps.github_artifact.outcome }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_ARTIFACT_OUTCOME" = "success" ]; then
            echo "MAIN_GUARD_EVIDENCE=github_actions_artifact"
            exit 0
          fi

          test -s artifacts/main-guard-evidence-fallback/verification.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/main-guard-evidence-fallback/verification.json").read_text(
                  encoding="utf-8"
              )
          )
          assert data.get("status") == "verified"
          assert data.get("transport") == "oci_object_storage"
          assert isinstance(data.get("size_bytes"), int) and data["size_bytes"] > 0
          digest = data.get("sha256")
          assert isinstance(digest, str) and len(digest) == 64
          print("MAIN_GUARD_EVIDENCE=oci_object_storage_verified")
          PY
