name: PR144 Head Preflight 7309332
on:
  push:
    branches: [audit/pr144-head-7309332-preflight]
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64, mei-backend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/final-audit-filter-clarification-20260919
          fetch-depth: 0
      - name: Validate audit governance and full targeted suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-audit-governance.py --output-dir runtime/audit-governance-self-test
          python3 scripts/repo_policy_guard.py
          bash -n scripts/instalar_monitoramento_vm.sh
          bash -n scripts/instalar_autorepair_vm.sh
          /home/ubuntu/mei-mg-email/.venv/bin/python -m pytest -q             tests/test_service_continuity_guards.py             tests/test_ndr_guard.py             tests/test_brevo_runtime_contract.py             tests/test_runtime_policy_contract_guard.py             tests/test_sender_blocked_circuit.py
