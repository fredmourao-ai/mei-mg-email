<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Contabilidade Melo</title>
  <desc id="desc">Logo em azul-marinho da Contabilidade Melo com emblema circular e tipografia elegante.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#163c66"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#b8c6d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071428" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="820" height="220" fill="#ffffff"/>

  <g filter="url(#shadow)">
    <rect x="118" y="48" width="660" height="124" rx="28" fill="url(#panel)"/>
    <rect x="126" y="56" width="644" height="108" rx="22" fill="none" stroke="url(#silver)" stroke-width="3" opacity="0.65"/>
  </g>

  <g transform="translate(36 26)" filter="url(#shadow)">
    <circle cx="84" cy="84" r="78" fill="#ffffff" stroke="#0b1f3a" stroke-width="8"/>
    <circle cx="84" cy="84" r="61" fill="none" stroke="#c7d2df" stroke-width="3"/>
    <!-- Caduceu: elmo e asas, bastão e duas serpentes entrelaçadas. -->
    <path d="M84 48v78" stroke="#0b1f3a" stroke-width="7" stroke-linecap="round"/>
    <path d="M72 53c3-12 21-12 24 0l-3 7H75z" fill="#163c66"/>
    <path d="M75 62c-14-15-25-10-31 3c12-1 22 3 30 11M93 62c14-15 25-10 31 3c-12-1-22 3-30 11" fill="none" stroke="#163c66" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 70c-17 4-19 17-4 23c20 8 20 22 3 29c-10 4-11 11-4 15" fill="none" stroke="#163c66" stroke-width="6" stroke-linecap="round"/>
    <path d="M98 70c17 4 19 17 4 23c-20 8-20 22-3 29c10 4 11 11 4 15" fill="none" stroke="#163c66" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="4" fill="#163c66"/>
    <circle cx="98" cy="70" r="4" fill="#163c66"/>
    <path d="M72 84h24M72 100h24" stroke="#0b1f3a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <text x="230" y="104" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600" letter-spacing="0.4">Contabilidade</text>
  <text x="526" y="116" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" font-weight="700">Melo</text>
  <path d="M226 133h464" stroke="#c7d2df" stroke-width="2" opacity="0.7"/>
  <text x="232" y="154" fill="#dce6f2" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="4">ORGANIZAÇÃO • CONFIANÇA • RESULTADOS</text>
</svg>
